<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CINESCAPE — Entertainment, in motion</title>
  <desc id="desc">A cinematic midnight-blue banner with glowing amber and cyan orbits, subtle stars, and the CINESCAPE wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b15"/>
      <stop offset=".55" stop-color="#111a30"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#ffb969" stop-opacity=".48"/><stop offset="1" stop-color="#ffb969" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#68dff5" stop-opacity=".3"/><stop offset="1" stop-color="#68dff5" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff5e4"/><stop offset="1" stop-color="#d6e9ff"/></linearGradient>
